<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Sueldo Neto al Instante</title>
    <style>
        :root {
            --primary: #4F46E5;
            --bg: #F9FAFB;
            --text: #1F2937;
            --card: #FFFFFF;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .calculator-card {
            background-color: var(--card);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            max-width: 400px;
            width: 100%;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 30px;
            text-align: center;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #4B5563;
        }
        input, select {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: 2px solid #E5E7EB;
            border-radius: 10px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: var(--primary);
        }
        .result-box {
            margin-top: 30px;
            background-color: #EEF2FF;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid #C7D2FE;
        }
        .result-title {
            font-size: 14px;
            color: var(--primary);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .result-value {
            font-size: 48px;
            font-weight: 800;
            color: var(--primary);
            margin: 10px 0 0 0;
        }
        .details {
            font-size: 12px;
            color: #6B7280;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="calculator-card">
        <h1>Calculadora de Sueldo Neto</h1>
        
        <div class="input-group">
            <label for="bruto">Sueldo Bruto Anual (€)</label>
            <input type="number" id="bruto" placeholder="Ej. 30000" oninput="calcularNeto()">
        </div>

        <div class="input-group">
            <label for="region">Comunidad / Región</label>
            <select id="region" onchange="calcularNeto()">
                <option value="catalunya">Catalunya (Barcelona, etc.)</option>
                <option value="madrid">Madrid</option>
                <option value="general">Resto de España</option>
            </select>
        </div>

        <div class="input-group">
            <label for="jornada">Tipo de contrato</label>
            <select id="jornada" disabled>
                <option>Jornada completa estándar (40h)</option>
            </select>
        </div>

        <div class="result-box">
            <div class="result-title">Tu Neto Mensual (12 pagas)</div>
            <div class="result-value"><span id="neto">0</span> €</div>
        </div>
        
        <div class="details">
            *Cálculo estimado aplicando cuota obrera de la Seguridad Social (6.35%) y estimación de IRPF según tramos autonómicos.
        </div>
    </div>

    <script>
        function calcularNeto() {
            const brutoAnual = parseFloat(document.getElementById('bruto').value);
            const netoDisplay = document.getElementById('neto');
            const region = document.getElementById('region').value;

            if (isNaN(brutoAnual) || brutoAnual <= 0) {
                netoDisplay.innerText = "0";
                return;
            }

            // Descuento Seguridad Social (aprox 6.35%)
            let baseCotizacion = brutoAnual;
            if (baseCotizacion > 56640) baseCotizacion = 56640; // Tope máximo 2024
            const ss = baseCotizacion * 0.0635;

            // Estimación muy simplificada de IRPF para el prototipo
            let irpfPorcentaje = 0;
            if (brutoAnual < 15000) irpfPorcentaje = 0.02;
            else if (brutoAnual < 25000) irpfPorcentaje = 0.12;
            else if (brutoAnual < 35000) irpfPorcentaje = 0.16;
            else if (brutoAnual < 50000) irpfPorcentaje = 0.20;
            else irpfPorcentaje = 0.25;

            // Ajuste por comunidad (simplificado para el ejemplo)
            if (region === 'catalunya') irpfPorcentaje += 0.015; // Tramos autonómicos ligeramente superiores
            if (region === 'madrid') irpfPorcentaje -= 0.01;

            const irpf = brutoAnual * irpfPorcentaje;
            const netoAnual = brutoAnual - ss - irpf;
            
            // Calculamos en 12 pagas
            const netoMensual = netoAnual / 12;

            // Mostramos el resultado formateado
            netoDisplay.innerText = netoMensual.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }
    </script>
</body>
</html>
